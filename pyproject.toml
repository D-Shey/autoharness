[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoharness"
version = "0.1.0"
description = "Meta-harness: assemble a task-scoped set of skills and MCP servers for a coding agent, then tear it down."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autoharness = "autoharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoharness = ["data/*.json", "skill/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
